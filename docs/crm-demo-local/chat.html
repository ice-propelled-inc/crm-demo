<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07565b">
  <title>Web Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;560;650;700;760&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body class="chat-page">
  <header class="topbar">
    <div class="brand">
      <span class="logo" id="logo">BS</span>
      <div><div class="brand-name" id="clinicName">Clinic</div><div class="brand-sub">Web chat · demo with test data</div></div>
    </div>
  </header>
  <div class="chat-wrap">
    <section class="panel">
      <div class="assistant-head">
        <span class="tile teal"><svg class="i" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg></span>
        <div><h2>Chat with us</h2><div class="muted small" id="chatStatus">Write a message to start.</div></div>
        <span class="grow" style="flex:1"></span>
        <button class="btn sm" id="endBtn" disabled>End chat</button>
      </div>
      <div class="messages" id="messages"></div>
      <form class="composer" id="composer">
        <input id="text" placeholder="Type your message…" autocomplete="off" maxlength="2000">
        <button class="btn primary" id="sendBtn" aria-label="Send"><svg class="i" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg></button>
      </form>
      <div class="muted small" style="margin-top:.6rem">Demo only: please use test data, not real personal details.</div>
    </section>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="chat.js"></script>
</body>
</html>

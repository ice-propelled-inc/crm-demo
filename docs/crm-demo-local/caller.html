<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fake Caller</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .phone-card { max-width: 420px; margin: 32px auto; padding: 20px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    .phone-card h1 { font-size: 20px; margin: 0 0 4px; }
    .phone-card label { display: block; margin: 16px 0 6px; }
    .phone-card input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--surface-2); }
    .phone-actions { display: flex; gap: 8px; margin: 16px 0; }
    .phone-actions button { flex: 1; padding: 10px; }
    .phone-actions button:disabled { opacity: .45; cursor: default; }
    #callLog { font-size: 13px; max-height: 260px; overflow-y: auto; border-top: 1px solid var(--border); padding-top: 8px; }
    #callLog div { padding: 2px 0; }
  </style>
</head>
<body>
  <div class="phone-card">
    <h1 id="clinicName">Call the clinic</h1>
    <p class="muted">Fake call for the demo: no phone line. Open the call desk in Live mode on another tab or device, then press Call.</p>
    <label for="phone">Your phone number (sent as caller ID)</label>
    <input id="phone" type="tel" value="+1 416 555 0123">
    <div class="phone-actions">
      <button id="callBtn" class="primary">Call</button>
      <button id="hangupBtn" class="danger" disabled>Hang up</button>
    </div>
    <p>Status: <span id="callStatus" class="pill">Idle</span></p>
    <div id="callLog"></div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="fakecall.js"></script>
  <script src="caller.js"></script>
</body>
</html>
